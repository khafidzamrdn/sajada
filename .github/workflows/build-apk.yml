name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Create local.properties for Android SDK
      run: |
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle Wrapper
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sajada-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Release APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0-${{ github.run_number }}
        name: "Sajada App v1.0.${{ github.run_number }}"
        body: "Build otomatis terbaru aplikasi Absensi Jamaah 5 Waktu. Silakan download file APK di bawah ini."
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Latest Release Tag
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Sajada App - Latest Build"
        body: "Link unduhan permanen versi terbaru aplikasi Absensi Jamaah 5 Waktu."
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
